spring.application.name=presentaciones
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/presentaciones
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7

# Storage Configuration
app.storage.location=data/images

# Image Generation Configuration
app.image-generation.enabled=true
# Model: gpt-image-1 (default), gpt-image-1-mini, gpt-image-1.5, or dall-e-3
app.image-generation.model=gpt-image-1.5
# Size: for gpt-image-1 use 1536x1024 (landscape), 1024x1024, or 1024x1536; for dall-e-3 use 1792x1024 or 1024x1024
app.image-generation.size=1536x1024
# Quality: for gpt-image-1 use high, medium, or low; for dall-e-3 use standard or hd
app.image-generation.quality=high
